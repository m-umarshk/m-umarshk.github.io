# Site Settings
title: "Umar Sheikh"
author: "Umar"
description: "My Experience"
permalink: /:title/
lang: "en"
excerpt_separator: "\n\n\n"
date_format: "%B %d, %Y"

# Layout
show_excerpts: true       # Show excerpts on homepage
show_frame: true          # Display frame on large screens
show_sidebar: false       # Disable sidebar
show_minimal: false       # Keep normal layout

# Navigation Menu
navigation:
  - {file: "archive.html", sidebaricon: "🏠"}
  - {file: "README.md", sidebaricon: "📇"}

# External Links with icons (using emojis for full compatibility)
external:
  - {title: Mail, icon: "📧", url: "mailto:umarshk466742@gmail.com"}
  - {title: GitHub, icon: "🐙", url: "https://github.com/your-github-username"}
  - {title: Subscribe, icon: "📡", url: "/feed.xml"}

# Comments (optional)
comments:
#  disqus_shortname: ""    # Uncomment and set if using Disqus
#  isso_domain: ""         # Uncomment and set if using Isso comments

# Plugins
plugins:
  - jekyll-feed
